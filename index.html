<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#15111f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Finzalu" />
    <link rel="apple-touch-icon" href="/finzalu/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/finzalu/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&display=swap" />
    <style>
      /* Splash shown instantly, before the app's code loads */
      #splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
        background:radial-gradient(60% 38% at 50% 44%,color-mix(in srgb,var(--sp-a) 38%,transparent),transparent 70%),var(--sp-bg);
        transition:opacity .45s ease,transform .45s cubic-bezier(.4,0,.2,1)}
      #splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
      #splash svg{width:112px;height:112px;overflow:visible;animation:sp-breathe 2.4s ease-in-out .9s infinite}
      #splash .s{transform-origin:57px 63px;opacity:0;animation:sp-in .7s cubic-bezier(.2,.9,.3,1.25) forwards}
      #splash .s2{animation-delay:.09s}
      #splash .s3{transform-box:fill-box;transform-origin:center;opacity:0;animation:sp-pop .8s cubic-bezier(.2,.9,.3,1.3) .2s forwards}
      #splash .w{font:700 30px/1 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.03em;color:var(--sp-text);opacity:0;animation:sp-up .6s cubic-bezier(.2,.8,.2,1) .35s forwards}
      @keyframes sp-in{from{opacity:0;transform:rotate(-40deg) scale(.55)}to{opacity:1;transform:none}}
      @keyframes sp-pop{0%{opacity:0;transform:translate(5.3px,7.3px) scale(.6)}60%{opacity:1}100%{opacity:1;transform:none}}
      @keyframes sp-up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
      @keyframes sp-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
      @media (prefers-reduced-motion:reduce){#splash *{animation-duration:.001ms!important;animation-delay:0s!important;animation-iteration-count:1!important}}
    </style>
    <title>Finzalu</title>
  </head>
  <body style="margin:0;background:#15111f;">
    <div id="splash" aria-hidden="true">
      <svg viewBox="0 0 120 120">
        <defs><linearGradient id="spg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd27a"/><stop offset="1" stop-color="#ff9d2e"/></linearGradient></defs>
        <g stroke="var(--sp-bg)" stroke-width="3" stroke-linejoin="round">
          <path class="s" d="M57.0 63.0L57.0 17.0A46 46 0 0 1 57.0 109.0Z" fill="var(--sp-a)"/>
          <path class="s s2" d="M57.0 63.0L57.0 109.0A46 46 0 0 1 13.3 48.8Z" fill="var(--sp-a2)"/>
          <path class="s3" d="M51.7 55.7L8.0 41.5A46 46 0 0 1 51.7 9.7Z" fill="url(#spg)"/>
        </g>
      </svg>
      <div class="w">Finzalu</div>
    </div>
    <script>
      // Paint the splash with the user's own colors (saved by the app)
      (function () {
        var c = { bg: "#15111f", a: "#8466f2", a2: "#b9a6ff", text: "#f4f3f8" };
        try { var s = JSON.parse(localStorage.getItem("finzalu_splash") || "null"); if (s) for (var k in c) if (s[k]) c[k] = s[k]; } catch (e) {}
        var el = document.getElementById("splash"), st = el.style;
        st.setProperty("--sp-bg", c.bg); st.setProperty("--sp-a", c.a); st.setProperty("--sp-a2", c.a2); st.setProperty("--sp-text", c.text);
        document.body.style.background = c.bg;
        var t0 = Date.now(), done = false;
        window.__hideSplash = function () {
          if (done) return; done = true;
          setTimeout(function () {
            el.classList.add("out");
            setTimeout(function () { el.remove(); }, 500);
          }, Math.max(0, 900 - (Date.now() - t0)));
        };
        setTimeout(window.__hideSplash, 5000); // never get stuck
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
